spring.application.name=asset-registry
server.port=8080

# H2 in-memory database (data is reset every time the server restarts)
spring.datasource.url=jdbc:h2:mem:assetdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the "assets" table from the Asset entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Run data.sql after the table is created, to add the sample computers
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:assetdb)
spring.h2.console.enabled=true
